name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Unit & component tests
        run: bun run test:ci

      - name: Build
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: nexora-build-${{ github.run_number }}
          path: .output
          retention-days: 7

  release:
    name: Create release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexora-build-${{ github.run_number }}
          path: .output
      - name: Package
        run: tar -czf nexora-${{ github.ref_name }}.tar.gz .output
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: nexora-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
