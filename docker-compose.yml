services:
  app:
    build:
      context: .
      target: runtime
      args:
        VITE_BUILD_NUMBER: ${BUILD_NUMBER:-local}
        VITE_BUILD_COMMIT: ${BUILD_COMMIT:-dev}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Development container: hot reload against the mounted source tree.
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: deps
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: development
